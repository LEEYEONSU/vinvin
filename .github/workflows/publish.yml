name: 인스타 발행

# 매일 한 번 돌면서 queue/ 에서 「오늘 나갈 차례」인 한 건만 올린다.
# 11:51 UTC = 20:51 KST. 깃허브 사정으로 몇 분 늦을 수 있다.
on:
  schedule:
    - cron: '51 11 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: '이번에 올릴 건수 (기본 1)'
        required: false
        default: '1'

permissions:
  contents: write

concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 발행
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PUBLISH_LIMIT: ${{ github.event.inputs.limit || '1' }}
        run: python scripts/publish.py

      - name: 결과 기록
        if: always()
        run: |
          git config user.name  "wine-hoeoe bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "기록할 변화 없음"
          else
            git commit -m "발행 결과 기록 [skip ci]"
            git push
          fi
