name: 인스타 발행

# queue/ 에서 「오늘 나갈 차례」인 한 건만 올린다.
#
# 깃허브 예약 실행은 몇 시간씩 늦는다 (실측: 4~6시간). 그래서 하루에 다섯 번 돌리고,
# 실제 발행은 publish.py 가 한국 시각 18~23시 사이일 때만 한다.
# 이미 그날 올렸으면 나머지 실행은 그냥 지나간다.
# 날짜가 지난 건이 남아 있으면 시간대를 무시하고 올린다.
on:
  # publish.now 를 건드려 push 하면 그 자리에서 한 번 돈다.
  # (저장소 토큰에 Actions 권한이 없어 Run workflow 버튼을 못 쓰는 대신)
  push:
    paths:
      - 'publish.now'
  schedule:
    - cron: '47 3 * * *'
    - cron: '47 5 * * *'
    - cron: '47 7 * * *'
    - cron: '47 9 * * *'
    - cron: '47 11 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: '이번에 올릴 건수 (기본 1)'
        required: false
        default: '1'

permissions:
  contents: write

concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 발행
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PUBLISH_LIMIT: ${{ github.event.inputs.limit || '1' }}
          PUBLISH_WINDOW: '18-23'
          GITHUB_EVENT_NAME: ${{ github.event_name == 'push' && 'workflow_dispatch' || github.event_name }}
        run: python scripts/publish.py

      - name: 결과 기록
        if: always()
        run: |
          git config user.name  "wine-hoeoe bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "기록할 변화 없음"
          else
            git commit -m "발행 결과 기록 [skip ci]"
            git push
          fi
