name: 인스타 토큰 갱신

on:
  schedule:
    # 토요일 18:00 UTC = 일요일 03:00 (한국 시각)
    - cron: '0 18 * * 6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --quiet pynacl==1.5.0

      - name: 토큰 갱신
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python scripts/refresh_token.py

      - name: 상태 기록
        if: always()
        run: |
          git config user.name  "wine-hoeoe bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "변화 없음"
          else
            git commit -m "토큰 갱신 기록 [skip ci]"
            git push
          fi
